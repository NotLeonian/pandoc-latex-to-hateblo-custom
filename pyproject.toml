[project]
name = "pandoc-latex-to-hateblo-custom"
version = "2.1.0"
description = "LaTeXからはてな記法への変換用Pandocフィルタ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "panflute>=2.3.1",
    "requests>=2.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pyright>=1.1.408",
    "ruff>=0.15.9",
]

[tool.mypy]
exclude = '(^|/)_vendor/'
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
python_version = "3.13"

[tool.pyright]
exclude = [
    ".venv",
    "**/_vendor",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
pythonVersion = "3.13"
stubPath = "typings"

[tool.ruff]
extend-exclude = ["_vendor"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I"]

[[tool.mypy.overrides]]
module = "_vendor.*"
follow_imports = "skip"
